services:
  - type: web
    name: smartcart-ai-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: smartcart-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_FILE
        value: /var/data/shopping.sqlite
      - key: ENABLE_DEMO_ADMIN
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@smartcart.ai
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
